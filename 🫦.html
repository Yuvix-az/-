<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message 💀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            animation: appear 1.2s ease-in-out;
        }

        h1 {
            color: #ff003c;
            font-size: clamp(40px, 10vw, 100px);
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ff003c,
                         0 0 35px #ff003c;
            animation: pulse 1.5s infinite alternate;
        }

        p {
            margin-top: 25px;
            color: white;
            font-size: clamp(16px, 4vw, 25px);
            letter-spacing: 3px;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.08);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ZYVER IS GAY 💀</h1>
        <p>CAUGHT IN 4K 📸👽</p>
    </div>
</body>
</html>
